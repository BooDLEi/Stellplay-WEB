name: Sync Latest Official Stellive Songs

on:
  schedule:
    # 매일 한국 시간 낮 12:00 (UTC 03:00)에 자동 실행
    - cron: '0 3 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 버튼 클릭으로 즉시 수동 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Fetch and Sync Songs
        run: python scripts/sync_songs_github.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add songs-latest.json mobile/songs-latest.json
          if git diff --staged --quiet; then
            echo "No new songs detected. Everything is up to date."
          else
            git commit -m "chore: auto-sync latest official Stellive songs [skip ci]"
            git push
          fi
